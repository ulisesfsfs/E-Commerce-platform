server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users,/api/users/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products,/api/products/**

        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/carts,/api/carts/**
          filters:
            - name: CircuitBreaker
              args:
                name: cartServiceCircuitBreaker
                fallbackUri: forward:/fallback/cart-service

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders,/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/default

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments,/api/payments/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications,/api/notifications/**

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentMustBeLongEnoughAndSecure}

gateway:
  security:
    public-paths:
      - /api/users/auth/**
      - /actuator/**
      - /fallback/**
    public-get-paths:
      - /api/products
      - /api/products/**

eureka:
  client:
    registry-fetch-interval-seconds: 3
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,tracing
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      cartServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      orderServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    instances:
      cartServiceCircuitBreaker:
        timeout-duration: 3s
      orderServiceCircuitBreaker:
        timeout-duration: 3s

